name: openlist
services:
  openlist:
    image: openlistteam/openlist:v4.1.1@sha256:1fe801c0d3e169eb6710da6e7e1882b2385ba58230a60df5850bf3748822622f
    container_name: openlist
    deploy:
      resources:
        reservations:
          memory: 256M
    network_mode: bridge
    restart: unless-stopped
    user: "999:1000"
    ports:
      - target: 5244
        published: "54343"
        protocol: tcp
      - target: 5222
        published: "5222"
        protocol: tcp
      - target: 5277
        published: "52272"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /opt/openlist/data
      - type: bind
        source: /DATA/AppData
        target: /oplist
    environment:
      UMASK: "022"
      OPENLIST_ADMIN_PASSWORD: "casa8os1"
      dsfs: "fdvdf"
x-casaos:
  id: org.icewhale.openlist
  main: openlist
  icon: https://raw.githubusercontent.com/Doliopi/CasaOS-AppStore/refs/heads/gh-pages/apps/org.icewhale.openlist/assets/icon.svg
  scheme: http
  port_map: "5244"
  index: /
  title:
    en_US: OpenList
  version: "4.1.1"
