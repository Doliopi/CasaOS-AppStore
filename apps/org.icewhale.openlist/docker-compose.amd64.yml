name: openlist
services:
  openlist:
    image: openlistteam/openlist:v4.2.3@sha256:4e8d139ae3b39fa4a1ceb50da9d229abd48368311e46bd88a0d8d756d4bc32fb
    container_name: openlist
    deploy:
      resources:
        reservations:
          memory: 256M
    network_mode: bridge
    restart: unless-stopped
    user: "999:1000"
    ports:
      - target: 52844
        published: "5244"
        protocol: tcp
      - target: 5222
        published: "5222"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /opt/openlist/data
      - type: bind
        source: /DATA/AppData
        target: /oplist
    environment:
      UMASK: "022"
      OPENLIST_ADMIN_PASSWORD: "casa8os1"
      dsfs: "fdvdf"
x-casaos:
  id: org.icewhale.openlist
  main: openlist
  icon: https://raw.githubusercontent.com/Doliopi/CasaOS-AppStore/refs/heads/gh-pages/apps/org.icewhale.openlist/assets/icon.svg
  scheme: http
  port_map: "5244"
  index: /
  title:
    en_US: OpenList
  version: "4.2.3"
