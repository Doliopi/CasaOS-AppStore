name: portainer
services:
  portainer:
    image: portainer/portainer-ce:2.32.0@sha256:d8f33ebf4901b7f00483520090dacfca2f53f4761bb05a8ecc11ca9143cdc3de
    deploy:
      resources:
        reservations:
          memory: 32M
    network_mode: bridge
    ports:
      - target: 8000
        published: "8000"
        protocol: tcp
      - target: 9000
        published: "9000"
        protocol: tcp
      - target: 9443
        published: "9443"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID
        target: /data
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    container_name: portainer
x-casaos:
  id: org.icewhale.portainer
  icon: https://raw.githubusercontent.com/Doliopi/CasaOS-AppStore/refs/heads/gh-pages/apps/org.icewhale.portainer/assets/icon.svg
  main: portainer
  title:
    en_US: Portainer
  index: /
  port_map: "9000"
  scheme: http
  version: "2.32.0"
