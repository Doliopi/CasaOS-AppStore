name: pdfding
services:
  pdfding:
    image: mrmn/pdfding:v1.10.0@sha256:2d565f29f67cefbddae875ee75654e8d6a7b1d242acca892bc4e4da2a3bb7ce5
    deploy:
      resources:
        reservations:
          memory: "128M"
    network_mode: bridge
    ports:
      - target: 8000
        published: "8000"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/db
        target: /home/nonroot/pdfding/db
      - type: bind
        source: /DATA/AppData/$AppID/media
        target: /home/nonroot/pdfding/media
    environment:
      - HOST_NAME=*
      - SECRET_KEY=your_secret_key_here
      - CSRF_COOKIE_SECURE=FALSE
      - SESSION_COOKIE_SECURE=FALSE
      - DEBUG=FALSE
    container_name: pdfding
x-casaos:
  id: org.icewhale.pdfding
  icon: https://raw.githubusercontent.com/Doliopi/CasaOS-AppStore/refs/heads/gh-pages/apps/org.icewhale.pdfding/assets/icon.svg
  main: pdfding
  port_map: "8000"
  scheme: http
  title:
    en_US: PdfDing
  version: "1.7.5"
