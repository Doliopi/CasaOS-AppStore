name: autobrr
services:
  autobrr:
    container_name: autobrr
    image: ghcr.io/autobrr/autobrr:v1.80.0@sha256:10e491f1d7b2a86ecac9f2ce710bf3317617a9d91590f45cb4c26b3bf5b09213
    network_mode: bridge
    restart: unless-stopped
    environment:
      TZ: $TZ
    ports:
      - target: 7474
        published: "7474"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
x-casaos:
  id: org.icewhale.autobrr
  main: autobrr
  port_map: "7474"
  title:
    en_US: Autobrr
  icon: https://cdn.jsdelivr.net/gh/Doliopi/CasaOS-AppStore@gh-pages/apps/org.icewhale.autobrr/assets/icon.svg
  version: "1.80.0"
